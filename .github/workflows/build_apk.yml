Project Capacitor Android dengan UI mobile dan tombol utama aktif.

## Build lokal
npm install
npx cap add android
npx cap sync android
npx cap open android

Di Android Studio: Build > Generate Signed App Bundle / APK.

## GitHub Actions
Workflow `build-apk.yml` akan memasang Node/Java/Android SDK, membuat project Android, sync Capacitor, lalu menghasilkan `app-debug.apk`.
""",encoding="utf-8")
workflow="""name: Build TANI MODERN APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Install dependencies
        run: npm install
      - name: Validate web
        run: npm run build:web
      - name: Add Android
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tani-modern-v10.2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
"""
(root/".github/workflows/build-apk.yml").write_text(workflow,encoding="utf-8")

