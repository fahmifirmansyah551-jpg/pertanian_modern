<script>
const state={page:localStorage.getItem('tm_auth')?'home':'auth',authTab:'login',user:JSON.parse(localStorage.getItem('tm_user')||'null'),
garden:JSON.parse(localStorage.getItem('tm_garden')||'null')||[
{id:1,name:'Cabai Merah',area:'500 m²',age:'26 HST',progress:80,status:'Aktif'},
