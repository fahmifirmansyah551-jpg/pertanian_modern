const pages={home:'Beranda',garden:'Kebun Saya',scan:'Scan Tanaman',stats:'Statistik',profile:'Profil'};
function save(){localStorage.setItem('tm_garden',JSON.stringify(state.garden))}
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}
function app(){document.getElementById('app').innerHTML=state.page==='auth'?auth():main();bind()}
function auth(){return `<div class="screen auth"><div class="auth-card"><div class="logo">🌱 TANI MODERN</div><p class="tag">Bertani lebih mudah, hasil lebih maksimal</p>
<div class="tabs"><button class="${state.authTab==='login'?'active':''}" data-auth="login">MASUK</button><button class="${state.authTab==='register'?'active':''}" data-auth="register">DAFTAR</button></div>
${state.authTab==='login'?`<form id="loginForm"><div class="field"><label>Email atau Nomor HP</label><input id="loginId" required placeholder="Masukkan email / nomor HP"></div><div class="field"><label>Kata sandi</label><input id="loginPass" required type="password" placeholder="Masukkan kata sandi"></div><button class="primary">MASUK</button></form><p class="muted" style="text-align:center;margin-top:22px">Belum punya akun? <b>Gunakan tab DAFTAR.</b></p>`:
`<form id="regForm"><div class="field"><label>Nama Lengkap</label><input id="regName" required></div><div class="field"><label>Nomor HP / WhatsApp</label><input id="regPhone" required></div><div class="field"><label>Email</label><input id="regEmail" type="email" required></div><div class="field"><label>Kata sandi</label><input id="regPass" type="password" minlength="6" required></div><div class="field"><label>Konfirmasi kata sandi</label><input id="regPass2" type="password" required></div><button class="primary">DAFTAR</button></form><p class="muted" style="text-align:center;margin-top:18px">Sudah punya akun? <b>Kembali ke MASUK.</b></p>`}</div></div>`}
function main(){return `<div class="screen"><header class="top"><div><h2>${pages[state.page]||'TANI MODERN'}</h2><small>🌱 Smart Farming</small></div><button class="iconbtn" data-action="notif">🔔</button></header><main class="content">${pageContent()}</main>${nav()}</div>`}
function pageContent(){
if(state.page==='home')return `<section class="hero"><h1>Halo, ${state.user?.name||'Petani'}! 👋</h1><p>Semangat bertani hari ini.</p></section>
<div class="grid3"><div class="card"><div class="muted">Luas Kebun</div><div class="metric">2.500 m²</div></div><div class="card"><div class="muted">Komoditas</div><div class="metric">${state.garden.length}</div></div><div class="card"><div class="muted">Prediksi Panen</div><div class="metric">42 hari</div></div></div>
<h3>Cuaca & Lokasi</h3><div class="card"><b>📍 Bogor, Jawa Barat</b><div class="metric">26°C ☀️</div><p class="muted">Kelembapan 78% · Curah hujan 0 mm</p></div>
<h3>Aktivitas Hari Ini</h3><div class="list"><div class="row" data-go="scan">📷 <span>Periksa tanaman</span> <b>›</b></div><div class="row" data-go="garden">🌱 <span>Kelola kebun</span> <b>›</b></div><div class="row" data-go="stats">📊 <span>Lihat statistik</span> <b>›</b></div></div>`;
if(state.page==='garden')return `<div style="display:flex;justify-content:space-between;align-items:center"><div><h3 style="margin-bottom:2px">Semua Kebun</h3><span class="muted">${state.garden.length} komoditas</span></div><button class="primary" style="width:auto;margin:0" data-action="addGarden">＋ Tambah</button></div><div class="list" style="margin-top:15px">${state.garden.map(g=>`<div class="card"><div class="row" style="border:0;padding:0"><div><h3>${g.name}</h3><span class="muted">${g.area} · ${g.age}</span></div><button class="danger" data-delete="${g.id}">Hapus</button></div><div style="margin-top:14px;background:#e7f0ea;border-radius:10px;height:9px"><div style="width:${g.progress}%;background:var(--g);height:100%;border-radius:10px"></div></div><small>${g.progress}% pertumbuhan · ${g.status}</small></div>`).join('')}</div>`;
if(state.page==='scan')return `<div class="scanbox"><div><div class="target">📷</div><p>Arahkan kamera ke daun atau bagian tanaman</p></div></div><div class="grid"><button class="primary" data-action="camera">📷 Buka Kamera</button><button class="secondary" data-action="gallery">🖼️ Pilih Galeri</button></div><div class="card" style="margin-top:15px"><h3>AI Vision</h3><p class="muted">Ambil foto untuk mendapatkan diagnosis contoh.</p></div>`;
if(state.page==='stats')return `<div class="grid"><div class="card"><div class="muted">Produksi</div><div class="metric">1.850 kg</div></div><div class="card"><div class="muted">Laba Bersih</div><div class="metric">Rp 8,75 jt</div></div></div><div class="card" style="margin-top:14px"><h3>Prediksi Panen</h3><p>Cabai Merah</p><div class="metric">70–90 hari</div><p class="muted">Estimasi hasil 1.250–1.600 kg</p><button class="secondary" data-action="calendar">📅 Lihat Kalender Budidaya</button></div><div class="card" style="margin-top:14px"><h3>Keuangan / HPP</h3><p class="muted">Pendapatan Rp 12.450.000 · Pengeluaran Rp 3.700.000</p><button class="secondary" data-action="finance">Buka Keuangan</button></div>`;
return `<div class="card"><h3>👤 ${state.user?.name||'Petani'}</h3><p class="muted">${state.user?.email||state.user?.phone||''}</p></div><div class="list" style="margin-top:14px">
<div class="row" data-action="profileInfo">👤 <span>Profil Saya</span><b>›</b></div><div class="row" data-go="garden">🌱 <span>Kebun Saya</span><b>›</b></div><div class="row" data-action="history">🕘 <span>Riwayat Scan</span><b>›</b></div><div class="row" data-action="calendar">📅 <span>Kalender Budidaya</span><b>›</b></div><div class="row" data-action="finance">💰 <span>Keuangan / HPP</span><b>›</b></div><div class="row" data-action="settings">⚙️ <span>Pengaturan</span><b>›</b></div><div class="row" data-action="help">❓ <span>Bantuan & Panduan</span><b>›</b></div><button class="danger" style="width:100%" data-action="logout">Keluar / Logout</button></div>`;
}
function nav(){return `<nav class="nav">${[['home','⌂','Beranda'],['garden','▦','Kebun'],['scan','◉','Scan'],['stats','◌','Statistik'],['profile','♙','Profil']].map(x=>`<button class="${state.page===x[0]?'active':''}" data-go="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}
function bind(){
document.querySelectorAll('[data-auth]').forEach(b=>b.onclick=()=>{state.authTab=b.dataset.auth;app()});
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.page=b.dataset.go;app()});
const lf=document.getElementById('loginForm');if(lf)lf.onsubmit=e=>{e.preventDefault();const id=loginId.value.trim(),p=loginPass.value; if(p.length<3)return toast('Kata sandi terlalu pendek');state.user=JSON.parse(localStorage.getItem('tm_user')||'null')||{name:'Petani',email:id};localStorage.setItem('tm_auth','1');app();toast('Berhasil masuk')};
const rf=document.getElementById('regForm');if(rf)rf.onsubmit=e=>{e.preventDefault();if(regPass.value!==regPass2.value)return toast('Konfirmasi kata sandi berbeda');state.user={name:regName.value,phone:regPhone.value,email:regEmail.value};localStorage.setItem('tm_user',JSON.stringify(state.user));localStorage.setItem('tm_auth','1');state.page='home';app();toast('Akun berhasil dibuat')};
document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{state.garden=state.garden.filter(x=>x.id!=b.dataset.delete);save();app();toast('Kebun dihapus')});
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));
}
function action(a){
if(a==='logout'){localStorage.removeItem('tm_auth');state.page='auth';state.authTab='login';app();return}
if(a==='addGarden')return modal(`<h2>Tambah Kebun</h2><div class="field"><label>Nama Komoditas</label><input id="mName" placeholder="Contoh: Cabai Merah"></div><div class="field"><label>Luas Kebun</label><input id="mArea" placeholder="500 m²"></div><button class="primary" id="saveGarden">SIMPAN KEBUN</button>`);
if(a==='camera'||a==='gallery')return modal(`<h2>${a==='camera'?'Kamera':'Galeri'}</h2><p class="muted">${a==='camera'?'Di APK Capacitor, tombol ini dapat dihubungkan ke kamera native.':'Pilih foto tanaman dari perangkat.'}</p><input type="file" accept="image/*" ${a==='camera'?'capture="environment"':''} id="photo"><button class="primary" id="analyze">ANALISIS TANAMAN</button>`);
if(a==='history')return modal(`<h2>Riwayat Scan</h2><div class="list"><div class="row">🌶️ Cabai Merah <span class="muted">Bercak Daun · 82%</span></div><div class="row">🍅 Tomat <span class="muted">Layu Fusarium · 75%</span></div><div class="row">🌿 Sawi Hijau <span class="muted">Sehat · 96%</span></div></div>`);
if(a==='calendar')return modal(`<h2>Kalender Budidaya</h2><div class="list"><div class="row">01 Agu · Semai Benih <b>Selesai</b></div><div class="row">15 Agu · Pindah Tanam <b>Selesai</b></div><div class="row">22 Agu · Pemupukan Dasar <b>Selesai</b></div><div class="row">29 Agu · Penyemprotan <b>Hari ini</b></div><div class="row">05 Sep · Pengendalian Hama <b>Akan datang</b></div></div>`);
if(a==='finance')return modal(`<h2>Keuangan / HPP</h2><div class="card"><div class="muted">Laba Bersih</div><div class="metric">Rp 8.750.000</div><hr><p>Pendapatan: Rp 12.450.000</p><p>Pengeluaran: Rp 3.700.000</p></div>`);
if(a==='profileInfo')return modal(`<h2>Profil Saya</h2><p><b>Nama:</b> ${state.user?.name||'-'}</p><p><b>Email:</b> ${state.user?.email||'-'}</p><p><b>No. HP:</b> ${state.user?.phone||'-'}</p>`);
if(a==='settings')return modal(`<h2>Pengaturan</h2><div class="row">Notifikasi <input type="checkbox" checked></div><div class="row" style="margin-top:10px">Mode gelap <input type="checkbox" onchange="toast('Mode gelap demo')"></div>`);
if(a==='help')return modal(`<h2>Bantuan</h2><p>Gunakan menu bawah untuk berpindah fitur. Semua tombol utama v10.2 sudah memiliki aksi.</p><button class="primary" onclick="toast('Panduan dibuka')">MULAI PANDUAN</button>`);
if(a==='notif')toast('Tidak ada notifikasi baru');
}
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="sheet"><button class="close" id="close">×</button>${html}</div>`;document.body.appendChild(m);m.querySelector('#close').onclick=()=>m.remove();const sg=m.querySelector('#saveGarden');if(sg)sg.onclick=()=>{const n=m.querySelector('#mName').value.trim();if(!n)return toast('Nama komoditas wajib diisi');state.garden.push({id:Date.now(),name:n,area:m.querySelector('#mArea').value||'0 m²',age:'0 HST',progress:5,status:'Baru'});save();m.remove();app();toast('Kebun ditambahkan')};const an=m.querySelector('#analyze');if(an)an.onclick=()=>{m.remove();modal('<h2>Hasil Diagnosis</h2><div class="card"><h3>Cabai Merah</h3><p>Kemungkinan masalah: <b>Bercak Daun</b></p><p>Confidence: <b>82%</b></p><button class="primary" onclick="toast(\\'Disimpan ke riwayat\\')">SIMPAN KE RIWAYAT</button></div>')}}
app();
</script></body></html>'''

